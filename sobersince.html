<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobriety Tracker Widget</title>
    <style>
        .sobriety-card {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #ffffff;
            max-width: 350px;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin: 20px auto;
        }
        .sobriety-card h2 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 15px 0;
            opacity: 0.9;
        }
        .counter-display {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .counter-label {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .time-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 15px;
            font-size: 0.9rem;
        }
        .time-box span {
            display: block;
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="sobriety-card">
        <h2>I've been amphetamine free since:</h2>
        <div class="counter-display" id="days-count">0</div>
        <div class="counter-label" id="days-label">Days</div>

        <div class="time-breakdown">
            <div class="time-box"><span id="hours-count">0</span>Hours</div>
            <div class="time-box"><span id="mins-count">0</span>Minutes</div>
            <div class="time-box"><span id="secs-count">0</span>Seconds</div>
        </div>
    </div>

    <script>
        // 🌟 Set your exact sobriety start date and time here (Year, Month [0-11], Day, Hour, Minute)
        // Note: January is 0, February is 1, etc.
        const sobrietyStartDate = new Date(2026, 9, 23, 18, 37, 57);

        function updateCounter() {
            const now = new Date();
            const difference = now - sobrietyStartDate;

            // Math calculations for time intervals
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Update HTML elements
            document.getElementById('days-count').innerText = days;
            document.getElementById('days-label').innerText = days === 1 ? 'Day' : 'Days';
            document.getElementById('hours-count').innerText = hours;
            document.getElementById('mins-count').innerText = minutes;
            document.getElementById('secs-count').innerText = seconds;
        }

        // Run the counter immediately and update it every second
        updateCounter();
        setInterval(updateCounter, 1000);
    </script>

</body>
</html>
